<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cloud_hosting.ru — Продукты</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <style>
      .lab-section { background: var(--bg); padding: 64px 0; min-height: 60vh; }
      .lab-title { font-size: 36px; font-weight: 800; color: var(--text); margin-bottom: 8px; letter-spacing: -0.3px; }
      .lab-subtitle { color: var(--muted); margin-bottom: 40px; font-size: 16px; }
      .lab-card { border: 1px solid var(--line) !important; border-radius: 20px !important; box-shadow: 0 4px 20px rgba(17,24,39,0.06) !important; transition: transform 0.15s ease, box-shadow 0.15s ease; background: #fff; }
      .lab-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(17,24,39,0.12) !important; }
      .lab-price { font-size: 20px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
      .lab-product-card { border: 1px solid var(--line) !important; border-radius: 20px !important; box-shadow: 0 4px 20px rgba(17,24,39,0.06) !important; max-width: 640px; margin: 0 auto; background: #fff; }
      .btn-success { background: var(--green) !important; border-color: var(--green) !important; border-radius: 999px !important; font-weight: 600 !important; }
      .btn-success:hover { background: var(--green-dark) !important; border-color: var(--green-dark) !important; }
      .btn-outline-secondary { border-radius: 999px !important; font-weight: 600 !important; }
      .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
      .text-bg-success { background: var(--green) !important; }
    </style>
  </head>
  <body>
    <main>
      <div id="root"></div>
    </main>

    <div class="toast-container">
      <div id="lab-toast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">✅ <span id="lab-toast-msg">Тариф выбран</span></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { HeaderComponent } from "../js/components/header/index.js";
      import { FooterComponent } from "../js/components/footer/index.js";
      import { MainPage } from "../js/pages/main/index.js";

      new HeaderComponent(document.body).render();
      new FooterComponent(document.body).render();

      const root = document.getElementById("root");
      new MainPage(root).render();
    </script>
  </body>
</html>
